name: Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Deploy to SiteGround via rsync
        env:
          SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SSH_USER: ${{ secrets.SG_SSH_USER }}
          SSH_PORT: ${{ secrets.SG_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          
          # If key is encrypted with a passphrase (standard for SiteGround generated keys), decrypt it for the session
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/siteground_key || true
          fi
          
          # Sync out/ folder contents into SiteGround public_html/
          rsync -rlgoDzvc -i --delete -e "ssh -p ${SSH_PORT:-18765} -o StrictHostKeyChecking=no -i ~/.ssh/siteground_key" out/ $SSH_USER@$SSH_HOST:public_html/
