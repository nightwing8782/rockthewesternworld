name: Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Deploy to SiteGround via rsync
        env:
          SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SSH_USER: ${{ secrets.SG_SSH_USER }}
          SSH_PORT: ${{ secrets.SG_SSH_PORT }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y putty-tools
          mkdir -p ~/.ssh
          
          # Write raw key cleanly using python to preserve exact formatting & strip Windows CRLF
          python3 -c "
          import os
          key = os.environ.get('SSH_KEY', '').strip()
          with open('/home/runner/.ssh/raw_key', 'w', newline='\n') as f:
              f.write(key + '\n')
          "
          chmod 600 ~/.ssh/raw_key

          # Check if key is PuTTY format or OpenSSH format
          if grep -q "PuTTY-User-Key-File" ~/.ssh/raw_key; then
            echo "Converting PuTTY formatted key..."
            if [ -n "$SSH_PASSPHRASE" ]; then
              puttygen ~/.ssh/raw_key -P "$SSH_PASSPHRASE" -O private-openssh -o ~/.ssh/siteground_key
            else
              puttygen ~/.ssh/raw_key -O private-openssh -o ~/.ssh/siteground_key
            fi
          else
            cp ~/.ssh/raw_key ~/.ssh/siteground_key
            if [ -n "$SSH_PASSPHRASE" ]; then
              # Attempt openssl / ssh-keygen decryption for passphrase-protected OpenSSH keys
              openssl rsa -in ~/.ssh/raw_key -passin "pass:$SSH_PASSPHRASE" -out ~/.ssh/siteground_key 2>/dev/null || \
              ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/siteground_key || true
            fi
          fi
          
          chmod 600 ~/.ssh/siteground_key
          
          # Sync out/ folder contents into SiteGround public_html/ with RSA algorithm compatibility
          rsync -rlgoDzvc -i --delete -e "ssh -p ${SSH_PORT:-18765} -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa,rsa-sha2-512,rsa-sha2-256 -o HostkeyAlgorithms=+ssh-rsa -i ~/.ssh/siteground_key" out/ $SSH_USER@$SSH_HOST:public_html/
