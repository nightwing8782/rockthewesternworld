<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian to Charcoal) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#282420" />
      <stop offset="60%" stop-color="#191715" />
      <stop offset="100%" stop-color="#0E0C0B" />
    </radialGradient>

    <!-- 24K Brilliant Gold Facet Gradients -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="facetBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Shield Background Base with Rounded Deco Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Fine Art Deco Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#ringGold)" stroke-width="6" stroke-opacity="0.85" />
  <rect x="38" y="38" width="436" height="436" rx="74" fill="none" stroke="url(#ringGold)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Corner Art Deco Stepped Chevrons -->
  <polygon points="48,48 76,48 48,76" fill="url(#ringGold)" opacity="0.6" />
  <polygon points="464,48 436,48 464,76" fill="url(#ringGold)" opacity="0.6" />
  <polygon points="48,464 76,464 48,436" fill="url(#ringGold)" opacity="0.6" />
  <polygon points="464,464 436,464 464,436" fill="url(#ringGold)" opacity="0.6" />

  <!-- Outer Concentric Secondary Diamond Frame -->
  <polygon points="256,76 392,256 256,436 120,256" fill="none" stroke="url(#ringGold)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Soft Radiant Ambient Glow Behind Diamond -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)" />

  <!-- Drop Shadow for Dimensionality -->
  <polygon points="256,92 410,256 256,420 102,256" fill="#000000" opacity="0.6" transform="translate(0, 10)" />

  <!-- PRIMARY ART DECO GOLD DIAMOND (CARET ◆) -->
  <g>
    <!-- Facet 1: Top Quadrant (High Light & Brilliance) -->
    <polygon points="256,92 410,256 256,256" fill="url(#facetTop)" />
    
    <!-- Facet 2: Right Quadrant (Deep Amber Warmth) -->
    <polygon points="410,256 256,420 256,256" fill="url(#facetRight)" />
    
    <!-- Facet 3: Bottom Quadrant (Rich Antique Bronze Base) -->
    <polygon points="256,420 102,256 256,256" fill="url(#facetBottom)" />
    
    <!-- Facet 4: Left Quadrant (Radiant Golden Tone) -->
    <polygon points="102,256 256,92 256,256" fill="url(#facetLeft)" />

    <!-- Inner Stepped Diamond Inset Faceting -->
    <polygon points="256,160 352,256 256,256" fill="url(#facetTop)" opacity="0.5" />
    <polygon points="352,256 256,352 256,256" fill="url(#facetRight)" opacity="0.5" />
    <polygon points="256,352 160,256 256,256" fill="url(#facetBottom)" opacity="0.5" />
    <polygon points="160,256 256,160 256,256" fill="url(#facetLeft)" opacity="0.5" />

    <!-- Central Brilliant Apex Diamond -->
    <polygon points="256,212 300,256 256,300 212,256" fill="#FFFBEB" opacity="0.9" />

    <!-- Fine Gold Facet Ridge Lines -->
    <line x1="256" y1="92" x2="256" y2="420" stroke="#FFFBEB" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="102" y1="256" x2="410" y2="256" stroke="#FFFBEB" stroke-width="2.5" stroke-opacity="0.8" />
    <polygon points="256,92 410,256 256,420 102,256" fill="none" stroke="#FFFBEB" stroke-width="3" stroke-opacity="0.9" />
  </g>

  <!-- Left and Right Deco Gold Accent Pips -->
  <polygon points="64,256 76,244 88,256 76,268" fill="url(#ringGold)" opacity="0.8" />
  <polygon points="424,256 436,244 448,256 436,268" fill="url(#ringGold)" opacity="0.8" />
  <polygon points="256,48 268,60 256,72 244,60" fill="url(#ringGold)" opacity="0.8" />
  <polygon points="256,440 268,452 256,464 244,452" fill="url(#ringGold)" opacity="0.8" />
</svg>